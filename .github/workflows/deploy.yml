name: Deploy

# One workflow, two targets, one source of truth (main):
#   firebase → https://saf-checkin.web.app                              (canonical: SPA rewrites, 200s on deep links)
#   pages    → https://lucasvegamazzoni.github.io/saf-mental-health-site/ (mirror, subpath build)
# Firestore rules are deployed by the same run so schema + app never drift.
# Actions are pinned to commit SHAs (security audit LUC-95); bump deliberately.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx oxlint src
      - run: npm run build

  firebase:
    name: Firebase Hosting + rules (canonical)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    concurrency:
      group: firebase-live
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_BASE: /
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SAF_CHECKIN }}
          projectId: saf-checkin
          channelId: live
      - name: Deploy Firestore rules
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SAF_CHECKIN }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase deploy --only firestore:rules --project saf-checkin --non-interactive
      - name: Remove service-account file
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

  pages:
    name: GitHub Pages (mirror)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_BASE: /saf-mental-health-site/
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
